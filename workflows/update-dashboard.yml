name: Update GitHub Dashboard

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_dashboard.py'
      - 'tests/test_dashboard.py'
      - '.github/workflows/update-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_dashboard.py
      - name: Commit updated dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard.svg
          if git diff --cached --quiet; then
            echo 'Dashboard unchanged'
            exit 0
          fi
          git commit -m 'chore: update GitHub dashboard'
          git pull --rebase origin main
          git push origin HEAD:main
